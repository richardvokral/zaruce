name: ci

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  web:
    name: web + shared
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Verify bucket seed migration is up to date
        run: |
          node scripts/gen-bucket-seed.mjs
          git diff --exit-code -- db/migrations/0002_seed_buckets.sql

  python:
    name: face-generator (lint only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check services/face-generator
